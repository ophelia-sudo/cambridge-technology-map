&lt;script type=&quot;application/json&quot; id=&quot;codex-visualization-widget-state&quot;&gt;__CODEX_VISUALIZATION_WIDGET_STATE__&lt;/script&gt;
&lt;script&gt;(() =&gt; {
  const root = document.documentElement;
  const mediaQuery = globalThis.matchMedia(&quot;(prefers-color-scheme: dark)&quot;);
  const apply = Reflect.apply;
  const isArray = Array.isArray;
  const hasOwn = Object.hasOwn;
  const parentWindow = globalThis.parent;
  const stringify = JSON.stringify;
  const parse = JSON.parse;

    &quot;codex-visualization-widget-state&quot;,
  );

  let state = initialGlobals.widgetState ?? null;
  const statePersistence = initialGlobals.statePersistence ?? &quot;none&quot;;

  /** @type {Map&lt;number, { resolve: () =&gt; void; reject: (error: Error) =&gt; void; timeout: ReturnType&lt;typeof globalThis.setTimeout&gt;; serializedState: string }&gt;} */
  const pendingStateWrites = new Map();
  const persistenceError = () =&gt;
    Object.assign(
      new Error(&quot;The host could not persist the widget state update&quot;),
      {
        code: -32000,
        data: { code: &quot;widget_state_persistence_failed&quot;, retryable: false },
      },
    );

   * @param {object} prototype
   * @param {string} property
   */
  const getPrototypeGetter = (prototype, property) =&gt; {
    // oxlint-disable-next-line typescript/unbound-method -- invoked through captured Reflect.apply
    const getter = Object.getOwnPropertyDescriptor(prototype, property)?.get;
    if (getter == null) {
      throw new Error(`Missing ${property} getter`);
    }
    return getter;
  };
  const getMessageData = getPrototypeGetter(MessageEvent.prototype, &quot;data&quot;);
  const getMessagePorts = getPrototypeGetter(MessageEvent.prototype, &quot;ports&quot;);
  const getMessageSource = getPrototypeGetter(MessageEvent.prototype, &quot;source&quot;);
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const addHostMessageListener = MessagePort.prototype.addEventListener;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const postHostMessage = MessagePort.prototype.postMessage;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const startHostPort = MessagePort.prototype.start;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const stopMessagePropagation = Event.prototype.stopImmediatePropagation;
  /** @type {MessagePort | null} */
  let hostPort = null;
  const postToHost = (type, payload) =&gt; {
    if (hostPort != null) {
      apply(postHostMessage, hostPort, [{ type, ...payload }]);
    }
  };
  const openExternal = ({ href }) =&gt; {
    if (globalThis.navigator.userActivation?.isActive === true) {
      postToHost(&quot;open-external&quot;, { href });
    }
  };
  const sendFollowUpMessage = ({ context, prompt, title }) =&gt; {
    if (globalThis.navigator.userActivation?.isActive === true) {
      postToHost(&quot;follow-up&quot;, { context, prompt, title });
    }
    return Promise.resolve();
  };
  /**
   * @param {Record&lt;string, unknown&gt; | ((previous: Record&lt;string, unknown&gt; | null) =&gt; Record&lt;string, unknown&gt;)} next
   * @returns {Promise&lt;void&gt;}
   */
  const setWidgetState = async (next) =&gt; {
    const nextState = typeof next === &quot;function&quot; ? next(state) : next;
    if (
      nextState == null ||
      typeof nextState !== &quot;object&quot; ||
      isArray(nextState)
    ) {
      throw new TypeError(&quot;Widget state must be a JSON object&quot;);
    }

      nextState,
      (_key, /** @type {unknown} */ value) =&gt; {

          typeof value === &quot;undefined&quot; ||
          typeof value === &quot;function&quot; ||
          typeof value === &quot;symbol&quot; ||
          (typeof value === &quot;number&quot; &amp;&amp; !Number.isFinite(value))

          throw new TypeError(&quot;Widget state must be a JSON object&quot;);

      },

      parsedState == null ||
      typeof parsedState !== &quot;object&quot; ||
      isArray(parsedState)

      throw new TypeError(&quot;Widget state must be a JSON object&quot;);

      modelContent: null,
      privateContent: null,
      ...parsedState,

      hasOwn(storedState, &quot;imageIds&quot;) &amp;&amp;

        storedState.imageIds.some(

        new TypeError(&quot;Visualization state does not support image attachments&quot;),

    );

      throw persistenceError();
    }
    const id = ++nextStateRequestId;
    return new Promise((resolve, reject) =&gt; {
      const timeout = globalThis.setTimeout(() =&gt; {
        pendingStateWrites.delete(id);
        reject(persistenceError());
      }, 30_000);
      pendingStateWrites.set(id, { resolve, reject, timeout, serializedState });
      postToHost(&quot;widget-state-write&quot;, { id, state: serializedState });
    });

  const connectorGlobals = {};
  if (mockElement != null) {
    const values = new Map(Object.entries(parse(mockElement.textContent)));
    mockElement.remove();
    connectorGlobals.visualizationData = {
      updates: Array.from(values, ([name, value]) =&gt; ({
        name,
        revision: 1,
        state: &quot;ready&quot;,
        value: { type: &quot;json&quot;, value },
      })),
    };
    connectorGlobals.visualization = {
      /** @param {string} name @param {(value: unknown) =&gt; void} callback */
      onData(name, callback) {
        if (typeof callback !== &quot;function&quot;) {
          throw new TypeError(&quot;onData requires a callback&quot;);
        }
        try {
          callback(values.get(name));
        } catch (error) {
          // oxlint-disable-next-line no-console -- Keep authored callback failures local.
          console.error(&quot;Live visualization data callback failed&quot;, error);
        }
        // A static preview delivers the current fixture once per subscription.
        return () =&gt; {};
      },
    };
  }
  const syncTheme = () =&gt; {
    const theme = mediaQuery.matches ? &quot;dark&quot; : &quot;light&quot;;
    root.dataset.theme = theme;
    globalThis.openai = {
      ...globalThis.openai,
      ...connectorGlobals,
      openExternal,
      sendFollowUpMessage,
      setWidgetState,
      theme,
      visualizationStyleVariables: {},
      visualizationTheme: theme,
      widgetState: state,
      statePersistence,
      stateModelContext: &quot;none&quot;,
    };
    globalThis.dispatchEvent(
      new CustomEvent(&quot;openai:set_globals&quot;, {
        detail: { globals: globalThis.openai },
      }),
    );
  };
  const sendHeight = () =&gt; {
    postToHost(&quot;height&quot;, {
      height: Math.ceil(
        Math.max(
          document.body.scrollHeight,
          document.body.getBoundingClientRect().height,
        ),
      ),
    });
  };

  globalThis.addEventListener(
    &quot;message&quot;,
    (event) =&gt; {
      const data = apply(getMessageData, event, []);
      const ports = apply(getMessagePorts, event, []);
      const source = apply(getMessageSource, event, []);
      if (
        hostPort != null ||
        source !== parentWindow ||
        typeof data !== &quot;object&quot; ||
        data?.type !== &quot;codex-visualization-initialize&quot; ||
        !isArray(ports) ||
        ports.length !== 1
      ) {
        return;
      }
      apply(stopMessagePropagation, event, []);
      const nextHostPort = ports[0];
      try {
        apply(addHostMessageListener, nextHostPort, [
          &quot;message&quot;,
          (event) =&gt; {
            const data = apply(getMessageData, event, []);
            if (typeof data === &quot;object&quot; &amp;&amp; data?.type === &quot;measure&quot;) {
              sendHeight();
            } else if (
              typeof data === &quot;object&quot; &amp;&amp;
              data?.type === &quot;widget-state-result&quot;
            ) {
              /** @type {unknown} */
              const id = data.id;
              if (typeof id !== &quot;number&quot;) {
                return;
              }
              const pending = pendingStateWrites.get(id);
              if (pending != null) {
                pendingStateWrites.delete(id);
                globalThis.clearTimeout(pending.timeout);
                if (data.ok === true) {
                  pending.resolve();
                } else {
                  pending.reject(persistenceError());
                }
              }
            }
          },
        ]);
        apply(startHostPort, nextHostPort, []);
      } catch {
        return;
      }
      hostPort = nextHostPort;
      for (const [id, { serializedState }] of pendingStateWrites) {
        postToHost(&quot;widget-state-write&quot;, { id, state: serializedState });
      }
      sendHeight();
    },
    { capture: true },
  );
  document.currentScript?.remove();
  mediaQuery.addEventListener(&quot;change&quot;, syncTheme);
  globalThis.addEventListener(&quot;click&quot;, (event) =&gt; {
    if (event.defaultPrevented) {
      return;
    }
    let element = null;
    if (event.target instanceof globalThis.Element) {
      element = event.target;
    } else if (event.target instanceof globalThis.Node) {
      element = event.target.parentElement;
    }
    const link = element?.closest(&quot;a[href]&quot;);
    const href = link?.getAttribute(&quot;href&quot;);
    if (href == null) {
      return;
    }
    if (href.startsWith(&quot;#&quot;)) {
      let id;
      try {
        id = decodeURIComponent(href.slice(1));
      } catch {
        return;
      }
      const target = id.length === 0 ? root : document.getElementById(id);
      if (
        target == null ||
        globalThis.navigator.userActivation?.isActive !== true

        return;
      }

        top: target.getBoundingClientRect().top + globalThis.scrollY,
      });
      return;
    }
    event.preventDefault();
    openExternal({ href });
  });
  new ResizeObserver(sendHeight).observe(document.body);
  syncTheme();
})();

@media (pointer: coarse) {
  #volume-one-map summary { min-height: 44px; box-sizing: border-box; }

, Technocracy, Democracy: Understandings of Racial and Gender Equity in American Engineering Education&quot;, &quot;收录于 International Perspectives on Engineering Education，Springer，2015，171–189&quot;, &quot;https://link.springer.com/chapter/10.1007/978-3-319-16169-3_8&quot;], [&quot;Amy E. Slaton&quot;, &quot;所有优秀的人：高科技美国的多样性、差异与机会&quot;, &quot;All Good People: Diversity, Difference, and Opportunity in High-Tech America&quot;, &quot;待出版 · MIT Press · 发行方列预计 2027 年 4 月 6 日出版&quot;, &quot;https://www.penguinrandomhouse.com/books/852154/all-good-people-by-amy-e-slaton/&quot;]], &quot;8&quot;: [[&quot;Amiel Bize、Seth Denizen、Jayson Maurice Porter&quot;, &quot;作为档案的土壤&quot;, &quot;Unit 2: Soil as Archive&quot;, &quot;收录于 Emily Brownell 编，Grasping Soil: A Syllabus and Essays for the Environmental Humanities，White Horse Press，2026，39–45&quot;, &quot;https://www.jstor.org/stable/jj.39773731.6&quot;, &quot;&quot;, &quot;pdf/08-bize-2026.pdf&quot;], [&quot;Shadreck Chirikure、Thomas P. Thondhlana、Marcos Martinón-Torres、Thilo Rehren&quot;, &quot;穆塔帕王国与葡萄牙人：南部非洲的冶金考古与区域互动&quot;, &quot;The Mutapa and the Portuguese: Archaeometallurgy and Regional Interaction in Southern Africa&quot;, &quot;收录于 Archives, Objects, Places and Landscapes: Multidisciplinary Approaches to Decolonised Zimbabwean Pasts，2017，169–196&quot;, &quot;https://www.jstor.org/stable/j.ctvh9vz54.13&quot;]], &quot;9&quot;: [[&quot;Timothy J. LeCain&quot;, &quot;历史的物质：事物如何创造过去&quot;, &quot;The Matter of History: How Things Create the Past&quot;, &quot;Cambridge University Press，2017&quot;, &quot;https://doi.org/10.1017/9781316460252&quot;], [&quot;Vivian Xu&quot;, &quot;蚕项目&quot;, &quot;Silkworm Project&quot;, &quot;艺术研究项目，2012–2019&quot;, &quot;https://www.vivianxu.studio/silkworm-project&quot;], [&quot;Julia Ihls 等&quot;, &quot;&quot;, &quot;Living Material Archives: Epistemic Infrastructures under Conditions of Transformation, Decay and Finitude&quot;, &quot;Biotechnology Design 4，2026，e42&quot;, &quot;https://www.cambridge.org/core/journals/biotechnology-design/article/living-material-archives-epistemic-infrastructures-under-conditions-of-transformation-decay-and-finitude/4E063ABF0FDFB8A0AAD293EF81DDE182&quot;, &quot;&quot;, &quot;pdf/09-ihls-2026.pdf&quot;]], &quot;10&quot;: [[&quot;David L. Schoenbrun&quot;, &quot;我们吃什么，就是什么：非洲大湖地区的古代农业&quot;, &quot;We Are What We Eat: Ancient Agriculture between the Great Lakes&quot;, &quot;Journal of African History 34(1)，1993，1–31&quot;, &quot;https://doi.org/10.1017/S0021853700032989&quot;, &quot;&quot;, &quot;pdf/10-schoenbrun-1993.pdf&quot;], [&quot;David L. Schoenbrun&quot;, &quot;词语、事物与意义：作为历史重建工具的语言学&quot;, &quot;Words, Things, and Meaning: Linguistics as a Tool for Historical Reconstruction&quot;, &quot;收录于 The Oxford Handbook of African Languages，2020，960–972&quot;, &quot;https://doi.org/10.1093/oxfordhb/9780199609895.013.85&quot;]], &quot;11&quot;: [[&quot;Alexandra Hui&quot;, &quot;声音对象与声音产品：20世纪上半叶新聆听文化的标准化&quot;, &quot;Sound Objects and Sound Products: Standardizing a New Culture of Listening in the First Half of the Twentieth Century&quot;, &quot;Culture Unbound 4，2012，599–616&quot;, &quot;https://cultureunbound.ep.liu.se/article/view/2023&quot;, &quot;&quot;, &quot;pdf/11-hui-2012.pdf&quot;], [&quot;Marcy Norton、John Kuhn&quot;, &quot;迈向吊床史：大西洋世界中的一种原住民技术&quot;, &quot;Towards a History of the Hammock: An Indigenous Technology in the Atlantic World&quot;, &quot;postmedieval 16，2025，577–605&quot;, &quot;https://doi.org/10.1057/s41280-025-00379-w&quot;, &quot;&quot;, &quot;pdf/11-norton-2025.pdf&quot;]], &quot;21&quot;: [[&quot;Eugenia Lean&quot;, &quot;来自全球亚洲的札记&quot;, &quot;Notes from Global Asia&quot;, &quot;Journal for the History of Knowledge 5，2024，219–228&quot;, &quot;https://doi.org/10.55283/jhk.18452&quot;, &quot;&quot;, &quot;pdf/21-lean-2024.pdf&quot;]]}}

&lt;script&gt;
(() =&gt; {
  const root = document.getElementById(&quot;volume-one-map&quot;);
  const {authors, chapters, editorOrder, chapter19Order, references} = JSON.parse(document.getElementById(&quot;volume-one-map-data&quot;).textContent);
  const detailsNodes = new Map();

  function element(tag, cls, label) {
    const item = document.createElement(tag);
    if (cls) item.className = cls;
    if (label) item.textContent = label;
    return item;
  }

  function disclosure(id, title, range, subtitle, children, kind) {
    const box = element(&quot;details&quot;, kind);
    const summary = element(&quot;summary&quot;, &quot;cursor-interaction&quot;);
    summary.append(element(&quot;span&quot;, &quot;&quot;, title));
    if (range) summary.append(element(&quot;span&quot;, &quot;map-range text-muted text-small&quot;, range));
    if (subtitle) summary.append(element(&quot;span&quot;, &quot;map-subtitle text-muted text-small&quot;, subtitle));
    box.append(summary, children);
    detailsNodes.set(id, box);
    return box;
  }

  function people(entries, englishTitle) {
    const body = element(&quot;div&quot;, &quot;map-detail&quot;);
    if (englishTitle) body.append(element(&quot;p&quot;, &quot;map-question&quot;, englishTitle));
    const list = element(&quot;dl&quot;, &quot;map-people&quot;);
    for (const {name, unit, focus} of entries) {
      list.append(element(&quot;dt&quot;, &quot;&quot;, name));
      const description = element(&quot;dd&quot;);
      description.append(
        element(&quot;div&quot;, &quot;text-muted text-small&quot;, unit),
        element(&quot;p&quot;, &quot;&quot;, focus)
      );
      list.append(description);
    }
    body.append(list);
    return body;
  }

  function tree(items) {
    const list = element(&quot;ul&quot;, &quot;map-tree&quot;);
    for (const content of items) {
      const row = element(&quot;li&quot;);
      row.append(content);
      list.append(row);
    }
    return list;
  }

  function reading(entries) {
    const section = element(&quot;section&quot;, &quot;map-reading&quot;);
    section.append(element(&quot;h3&quot;, &quot;&quot;, &quot;相关文献&quot;));
    const list = element(&quot;ul&quot;);
    for (const [author, translated, title, publication, url, note, pdf] of entries) {
      const item = element(&quot;li&quot;);
      const link = element(&quot;a&quot;, &quot;&quot;, translated || title);
      link.href = url;
      link.target = &quot;_blank&quot;;
      link.rel = &quot;noopener noreferrer&quot;;
      item.append(link);
      if (translated) item.append(element(&quot;p&quot;, &quot;text-muted text-small&quot;, title));
      item.append(element(&quot;p&quot;, &quot;text-muted text-small&quot;, author + &quot; · &quot; + publication));
      if (note) item.append(element(&quot;p&quot;, &quot;text-small&quot;, note));
      if (pdf) {
        const download = element(&quot;a&quot;, &quot;btn text-small&quot;, &quot;下载 PDF&quot;);
        download.setAttribute(&quot;href&quot;, pdf);
        download.setAttribute(&quot;download&quot;, &quot;&quot;);
        download.setAttribute(&quot;aria-label&quot;, &quot;下载 PDF · &quot; + (translated || title));
        const actions = element(&quot;p&quot;, &quot;&quot;);
        actions.append(download);
        item.append(actions);
      }
      list.append(item);
    }
    section.append(list);
    return section;
  }

  function chapter(n) {
    const [title, englishTitle] = chapters[n - 1];
    const entries = n === 19
      ? chapter19Order.map(name =&gt; authors.find(author =&gt; author.name === name))
      : authors.filter(author =&gt; author.chapters.includes(n));
    const detail = people(entries, englishTitle);
    const works = references[n];
    if (works) detail.append(reading(works));
    const label = &quot;第 &quot; + n + &quot; 章&quot; + (works ? &quot; · &quot; + works.length + &quot; 条文献&quot; : &quot;&quot;);
    return disclosure(&quot;c&quot; + n, title, label, &quot;&quot;, detail, &quot;map-chapter&quot;);
  }

  function group(id, title, range, subtitle, children) {
    return disclosure(id, title, range, subtitle, tree(children), &quot;map-group&quot;);
  }

  function branch(title, label, question, children) {
    const section = element(&quot;section&quot;, &quot;map-branch&quot;);
    const heading = element(&quot;header&quot;, &quot;map-branch-heading&quot;);
    heading.append(element(&quot;h3&quot;, &quot;&quot;, title), element(&quot;p&quot;, &quot;text-muted text-small&quot;, label + &quot;　&quot; + question));
    section.append(heading, tree(children));
    return section;
  }

  const sequence = (from, to) =&gt; Array.from({length: to - from + 1}, (_, i) =&gt; chapter(from + i));
  const frontMatter = tree([
    element(&quot;div&quot;, &quot;&quot;, &quot;编者序言与致谢&quot;),
    element(&quot;div&quot;, &quot;&quot;, &quot;撰稿人简介&quot;),
    element(&quot;div&quot;, &quot;&quot;, &quot;插图目录&quot;),
    disclosure(&quot;general&quot;, &quot;总导论&quot;, &quot;5 位编者&quot;, &quot;&quot;,
      people(editorOrder.map(name =&gt; authors.find(author =&gt; author.name === name)), &quot;General Introduction&quot;), &quot;map-group&quot;),
    element(&quot;div&quot;, &quot;&quot;, &quot;第一卷读者指南&quot;)
  ]);
  root.querySelector(&quot;.map-intro&quot;).append(disclosure(&quot;intro&quot;, &quot;卷首&quot;, &quot;&quot;, &quot;&quot;, frontMatter, &quot;map-group&quot;));
  root.querySelector(&quot;.map-branches&quot;).append(
    branch(&quot;第一部分　技术概念化&quot;, &quot;第 1–7 章&quot;, &quot;技术是什么？它如何参与塑造社会？&quot;, sequence(1, 7)),
    branch(&quot;第二部分　方法与证据&quot;, &quot;第 8–28 章&quot;, &quot;技术史用什么证据、从哪些视角来写？&quot;, [
      group(&quot;evidence&quot;, &quot;新证据&quot;, &quot;第 8–11 章&quot;, &quot;景观、材料、口头性与语言、感官&quot;, sequence(8, 11)),
      group(&quot;decolonize&quot;, &quot;去殖民技术史&quot;, &quot;第 12–19 章&quot;, &quot;区域技术史、编史学反思&quot;, [
        group(&quot;regional&quot;, &quot;区域技术史&quot;, &quot;第 12–16 章&quot;, &quot;拉丁美洲、朝鲜、中国、苏联、奥斯曼帝国&quot;, sequence(12, 16)),
        group(&quot;historiography&quot;, &quot;编史学反思&quot;, &quot;第 17–19 章&quot;, &quot;&quot;, sequence(17, 19))
      ]),
      group(&quot;disciplines&quot;, &quot;技术史与其他学科&quot;, &quot;第 20–28 章&quot;,
        &quot;哲学、科学史、医学史、劳工史、STS、人类学、环境史、后人类、差异史&quot;, sequence(20, 28))
    ])
  );

  function restore(state) {
    const open = state?.privateContent?.open;
    if (!Array.isArray(open)) return;
    const active = new Set(open);
    for (const [id, node] of detailsNodes) node.open = active.has(id);
  }

  restore(window.openai?.widgetState);
  window.addEventListener(&quot;openai:set_globals&quot;, event =&gt; restore(event.detail?.globals?.widgetState));
  root.addEventListener(&quot;click&quot;, event =&gt; {
    if (!(event.target instanceof Element) || !event.target.closest(&quot;summary&quot;)) return;
    window.setTimeout(() =&gt; {
      if (!window.openai?.setWidgetState) return;
      const open = [...detailsNodes].filter(([, node]) =&gt; node.open).map(([id]) =&gt; id);
      window.openai.setWidgetState({privateContent: {open}, modelContent: {expandedChapters: open.filter(id =&gt; /^c\d+$/.test(id)).map(id =&gt; Number(id.slice(1)))}}).catch(() =&gt; {});
    }, 0);
  });
})();
&lt;/script&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;
  let lastPointerWasTouch = false;
  let pinnedByTouch = false;

  const getTrigger = (event) =&gt; {
    for (const target of event.composedPath()) {
      if (target?.nodeType === Node.ELEMENT_NODE) {
        const trigger = target.closest(&quot;[data-tooltip]&quot;);
        if (trigger) return trigger;
      }
    }
    return null;
  };
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    pinnedByTouch = false;
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
